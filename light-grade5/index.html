<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light and Its Properties — Grade 5</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="responsive-container">
    <div class="responsive-wrapper">
      <div id="app"></div>
    </div>
  </div>

  <!-- Strict load order: data -> sound -> utils -> mini-react -> domain -> components -> app -->
  <script src="data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/mini-react.js"></script>
  <script src="js/lightScene.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('load', function boot() {
      if (!window.appData) { setTimeout(boot, 100); return; }
      if (typeof initializeResponsiveScaling === 'function') initializeResponsiveScaling();
      if (typeof initializeApp === 'function') initializeApp();
    });
  </script>
</body>
</html>
