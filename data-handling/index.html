<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Handling - Pictographs and Bar Graphs</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="responsive-container">
    <div class="responsive-wrapper" id="root"></div>
  </div>
  <script>
    function updateScaleFactor(){
      var scaleW = window.innerWidth / 1920;
      var scaleH = window.innerHeight / 1080;
      var scale = Math.min(scaleW, scaleH);
      document.documentElement.style.setProperty('--scaleFactor', scale);
    }
    updateScaleFactor();
    window.addEventListener('resize', updateScaleFactor);
  </script>
  <script src="utils/mini-react.js"></script>
  <script src="utils/touch-drag.js"></script>
  <script src="utils/i18n.js"></script>
  <script src="hooks/useResponsiveLayout.js"></script>
  <script src="hooks/useAudioFeedback.js"></script>
  <script src="hooks/useAppletState.js"></script>
  <script src="components/PictogramTable.jsx"></script>
  <script src="components/RepresentationScreen.jsx"></script>
  <script src="components/OrientationScreen.jsx"></script>
  <script src="components/StructureScreen.jsx"></script>
  <script src="components/LabelsScreen.jsx"></script>
  <script src="components/PlotPictogramScreen.jsx"></script>
  <script src="components/PictographTitleScreen.jsx"></script>
  <script src="components/XAxisScreen.jsx"></script>
  <script src="components/YAxisScaleScreen.jsx"></script>
  <script src="components/DrawBarsScreen.jsx"></script>
  <script src="components/BarGraphTitleScreen.jsx"></script>
  <script src="components/AppletContainer.jsx"></script>
  <script src="data.js"></script>
  <script>
    (function(){
      var root = document.getElementById('root');
      root.innerHTML = '';
      window.MiniReact.render(window.MiniReact.h(window.AppletContainer, { appData: window.appData }), root);
    })();
  </script>
</body>
</html>
