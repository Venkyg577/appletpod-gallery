[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOW-FROM https://appletpod.com"
    Content-Security-Policy = "frame-ancestors 'self' https://appletpod.com https://*.appletpod.com"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Applets that load .jsx directly via <script type="text/babel"> need a
# JavaScript MIME type. Netlify defaults .jsx to application/octet-stream,
# which the browser refuses to execute under X-Content-Type-Options: nosniff.
# Not marked immutable: these are unversioned source files, so a long
# max-age would strand edits behind stale caches.
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/registry.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "https://appletpod.com"

[build]
  publish = "."
